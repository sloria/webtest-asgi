[tox]
envlist = lint,py310-lowest,py310,py311,py312,py313,py314,

[testenv]
extras = tests
deps =
    lowest: starlette==1.2.0
    lowest: httpx2==2.0.0
commands = pytest {posargs}

[testenv:lint]
deps = pre-commit~=4.0.1
skip_install = true
commands = pre-commit run --all-files

; Below tasks are for development only (not run in CI)

[testenv:watch-readme]
deps = restview
skip_install = true
commands = restview README.rst
